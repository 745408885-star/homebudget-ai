[project]
name = "homebudget-ai-backend"
version = "0.1.0a1"
description = "FastAPI backend for the HomeBudget AI alpha technical preview"
requires-python = ">=3.12"
license = "Apache-2.0"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["F401"]
"alembic/versions/*.py" = ["E501"]
"alembic/drafts/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_missing_imports = true
